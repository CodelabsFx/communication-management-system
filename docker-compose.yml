version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080/ws

  backend:
    build:
      context: ./backend
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - APP_ENV=development
      - HTTP_ADDR=0.0.0.0:8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/comm_system?sslmode=disable
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=comm-files
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - JWT_SECRET=replace-with-secure-secret

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comm_system
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
